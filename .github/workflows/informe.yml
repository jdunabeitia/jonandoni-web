name: "Informe de publicaciones"
on:
  push:
    paths: ["informe/revisar.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: web
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python informe/revisar.py
      - run: |
          git config user.name "jdunabeitia"
          git config user.email "j.dunabeitia@icloud.com"
          git add informe/resultado.json
          git commit -m "Informe de publicaciones" || true
          git pull --rebase && git push
