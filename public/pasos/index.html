<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pasos que Piensan · Acceso</title>
<style>
:root{--bg:#F1F4F1;--card:#fff;--ink:#17251F;--muted:#56665E;--line:#CBD6CF;--accent:#1F6B57;--warn:#B4442F}
@media (prefers-color-scheme:dark){:root{--bg:#0F1714;--card:#16211D;--ink:#E6EEE9;--muted:#9DB0A6;--line:#2C3D36;--accent:#5CC4A3;--warn:#F07B63;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:14px}
h1{margin:0;font-size:28px;line-height:1.1;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--accent)}
p{margin:0;color:var(--muted);font-size:15px}
label{font-size:14px;font-weight:600}
input{font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);width:100%}
input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
button{font:inherit;font-weight:700;padding:12px;border-radius:999px;border:0;background:var(--accent);color:var(--bg);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--warn);font-size:14px;min-height:1.4em}
.fp{display:flex;gap:6px;opacity:.5}
.fp span{width:10px;height:16px;border-radius:50%;background:var(--ink)}
.fp span:nth-child(even){transform:translateY(-6px)}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="fp" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  <h1>Pasos que <em>piensan</em></h1>
  <p>Propuesta de proyecto con acceso restringido.</p>
  <label for="pw">Clave de acceso</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <button id="go" type="submit">Entrar</button>
  <div class="err" id="err" role="alert"></div>
</form>

async function open_(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.salt),iterations:D.it,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.iv)},k,u(D.ct));
  return new TextDecoder().decode(pt);
}
async function enter(pw,silent){
  const b=document.getElementById("go");b.disabled=true;b.textContent="Abriendo…";
  try{const h=await open_(pw);try{sessionStorage.setItem("pqp",pw)}catch(e){}
    document.open();document.write(h);document.close();}
  catch(e){try{sessionStorage.removeItem("pqp")}catch(_){}
    if(!silent)document.getElementById("err").textContent="Clave incorrecta. Revísala e inténtalo de nuevo.";

}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();enter(document.getElementById("pw").value)});
